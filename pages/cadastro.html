<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Criar conta | Cuba Barbearia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="../css/cadastro.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/cadastro.js"></script>

</head>
<body>

  <main class="auth">
    <a href="../index.html" class="auth__back">&larr; Voltar ao site</a>

    <section class="auth__card" id="card">
      <header class="auth__head">
        <div class="auth__pole" aria-hidden="true"></div>
        <div>
          <h1>Criar conta</h1>
          <p>Cadastre-se para agendar seus horários na Cuba Barbearia.</p>
        </div>
      </header>

      <form id="form-cadastro" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required>
          <span class="field__erro" data-erro="nome"></span>
        </div>

        <div class="field">
          <label for="telefone">WhatsApp</label>
          <input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(61) 99999-9999" required>
          <span class="field__erro" data-erro="telefone"></span>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
          <span class="field__erro" data-erro="email"></span>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="field__senha">
            <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required>
            <button type="button" class="field__ver" id="ver-senha" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <span class="meter" aria-hidden="true"><i id="forca"></i></span>
          <span class="field__erro" data-erro="senha"></span>
        </div>

        <div class="field">
          <label for="confirmar">Confirmar senha</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" placeholder="Repita a senha" required>
          <span class="field__erro" data-erro="confirmar"></span>
        </div>

        <label class="check">
          <input type="checkbox" id="termos" name="termos" required>
          <span>Aceito receber confirmações de agendamento e concordo com os termos de uso.</span>
        </label>
        <span class="field__erro" data-erro="termos"></span>

        <button class="btn" type="submit" id="btn-enviar">Criar minha conta</button>
        <p class="form__msg" id="msg" role="status" aria-live="polite"></p>
      </form>

      <!-- Tela de sucesso (aparece no lugar do formulário) -->
      <div class="ok" id="ok" hidden>
        <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg>
        <h2 id="ok-titulo">Conta criada!</h2>
        <p id="ok-texto"></p>
        <a href="../index.html" class="btn">Ir para o início</a>
      </div>

      <p class="auth__foot">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

</body>
</html>
