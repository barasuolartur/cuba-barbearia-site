<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Entrar | Cuba Barbearia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

 <link rel="stylesheet" 
 href="../css/cadastro.css"

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="../js/login.js"></script>

</head>
<body>

  <main class="auth">
    <a href="../index.html" class="auth__back">&larr; Voltar ao site</a>

    <section class="auth__card" id="card">
      <header class="auth__head">
        <div class="auth__pole" aria-hidden="true"></div>
        <div>
          <h1>Entrar</h1>
          <p>Acesse sua conta para agendar seus horários.</p>
        </div>
      </header>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
          <span class="field__erro" data-erro="email"></span>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="field__senha">
            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
            <button type="button" class="field__ver" id="ver-senha" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <span class="field__erro" data-erro="senha"></span>
        </div>

        <button class="btn" type="submit" id="btn-enviar">Entrar</button>
        <p class="form__msg" id="msg" role="status" aria-live="polite"></p>
      </form>

      <p class="auth__foot">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

</body>
</html>
